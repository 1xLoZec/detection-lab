title: Local Account Discovery via whoami and hostname Spawned by Scripting Engine
id: 5d9f4578-3ec8-4b4a-902d-62f951b3d28a
status: experimental
description: Detects whoami.exe or HOSTNAME.EXE spawned by scripting engines or non-standard parent processes under interactive user accounts at Medium or High integrity level, consistent with post-exploitation local account discovery (T1087.001).
author: 1xLoZec
date: 2026/05/10
references:
    - https://attack.mitre.org/techniques/T1087/001/
tags:
    - attack.discovery
    - attack.t1087.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_process:
        event.code: '1'
        process.name|contains:
            - 'whoami.exe'
            - 'HOSTNAME.EXE'
    selection_parent:
        process.parent.name|contains:
            - 'powershell.exe'
            - 'cmd.exe'
            - 'wscript.exe'
            - 'cscript.exe'
            - 'mshta.exe'
            - 'python.exe'
            - 'pwsh.exe'
    selection_integrity:
        winlog.event_data.IntegrityLevel|contains:
            - 'Medium'
            - 'High'
    condition: selection_process and selection_parent and selection_integrity
falsepositives:
    - Legitimate administrative scripts or IT automation tools that invoke whoami or hostname for inventory or diagnostic purposes
    - Software deployment frameworks or monitoring agents running under interactive user sessions
level: medium




