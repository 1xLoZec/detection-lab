title: PowerShell Process Injection via Invoke-MalDoc and Raw GitHub Payload Fetch
id: 0f2928af-3955-4131-ae07-2a35ad02725e
status: experimental
description: Detects PowerShell spawning with command lines referencing Invoke-MalDoc and fetching T1055 injection payloads from raw.githubusercontent.com, indicative of Atomic Red Team process injection tests or real T1055 activity delivered via Office macro triggers.
author: 1xLoZec
date: 2026/05/10
references:
    - https://attack.mitre.org/techniques/T1055/
    - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1055/T1055.md
tags:
    - attack.defense_evasion
    - attack.t1055
    - attack.t1204.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_process:
        event.code: '1'
        process.name: 'powershell.exe'
    selection_commandline:
        process.command_line|contains|all:
            - 'Invoke-MalDoc'
            - 'T1055'
            - 'raw.githubusercontent.com'
    selection_integrity:
        winlog.event_data.IntegrityLevel: 'High'
    condition: selection_process and selection_commandline and selection_integrity
falsepositives:
    - Authorized red team or penetration testing exercises using Atomic Red Team framework
    - Security researchers executing T1055 simulations in lab environments
level: high


