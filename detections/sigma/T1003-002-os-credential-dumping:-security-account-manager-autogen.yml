title: SAM Registry Hive Dumping via Reg Save Command
id: c5830d3b-c4fb-465d-8540-44e6b09fc8e7
status: experimental
description: Detects processes executing reg save commands targeting HKLM\SAM, HKLM\SYSTEM, or HKLM\SECURITY registry hives, commonly used for offline credential extraction. This technique is associated with T1003.002 OS Credential Dumping via the Security Account Manager.
author: 1xLoZec
date: 2026/05/10
references:
    - https://attack.mitre.org/techniques/T1003/002/
    - https://www.ired.team/offensive-security/credential-access-and-credential-dumping/dumping-credentials-from-windows-registry
tags:
    - attack.credential_access
    - attack.t1003.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_process:
        event.code: '1'
        process.name|contains:
            - 'reg.exe'
            - 'cmd.exe'
    selection_commandline:
        process.command_line|contains|all:
            - 'reg save'
            - 'HKLM'
    selection_hive_targets:
        process.command_line|contains:
            - 'HKLM\sam'
            - 'HKLM\SAM'
            - 'HKLM\system'
            - 'HKLM\SYSTEM'
            - 'HKLM\security'
            - 'HKLM\SECURITY'
    filter_legitimate_backup:
        process.parent.name: 'wbengine.exe'
    condition: selection_process and selection_commandline and selection_hive_targets and not filter_legitimate_backup
falsepositives:
    - Legitimate system backup software or administrators performing authorized registry backups using reg save against system hives
    - Enterprise backup solutions that snapshot registry hives as part of scheduled maintenance
level: high



