title: Windows Credential Manager Injection via cmdkey.exe for RDP Lateral Movement
id: 0ba73e8e-e872-4067-ac92-e53d7af7b7f1
status: experimental
description: Detects cmdkey.exe invoked with plaintext credentials targeting TERMSRV namespace, indicating credential staging for RDP lateral movement via Windows Credential Manager (T1555.004).
author: 1xLoZec
date: 2026/05/10
references:
    - https://attack.mitre.org/techniques/T1555/004/
    - https://docs.microsoft.com/en-us/windows-server/administration/windows-commands/cmdkey
tags:
    - attack.credential_access
    - attack.t1555.004
    - attack.lateral_movement
    - attack.t1021.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_process:
        event.code: '1'
        process.name: 'cmdkey.exe'
    selection_termsrv:
        process.command_line|contains: '/generic:TERMSRV'
    selection_pass:
        process.command_line|contains: '/pass:'
    condition: selection_process and (selection_termsrv or selection_pass)
falsepositives:
    - Legitimate administrative scripts that automate RDP connections using cmdkey for service accounts in managed environments
    - IT automation tools or deployment pipelines that programmatically store RDP credentials
fields:
    - process.name
    - process.executable
    - process.command_line
    - process.parent.name
    - process.parent.executable
    - winlog.event_data.IntegrityLevel
level: high