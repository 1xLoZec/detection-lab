title: T1055 Process Injection via PowerShell IEX and CreateRemoteThread to Unknown Process
id: 7a254b3e-7547-4aae-b028-4263188c0031
status: experimental
description: Detects PowerShell downloading and executing Invoke-MalDoc via IEX from raw.githubusercontent.com targeting T1055 process injection macro code, corroborated by Sysmon Event ID 8 CreateRemoteThread targeting an unknown process. Also flags sdbinst.exe with shim-based injection arguments as a secondary indicator.
author: 1xLoZec
date: 2026/05/10
references:
  - https://attack.mitre.org/techniques/T1055/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1055/T1055.md
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1204.002/src/Invoke-MalDoc.ps1
tags:
  - attack.defense_evasion
  - attack.t1055
  - attack.t1204.002
logsource:
  product: windows
  category: process_creation
detection:
  selection_powershell_iex_invokemaldoc:
    event.code: '1'
    process.name: 'powershell.exe'
    process.command_line|contains|all:
      - 'IEX'
      - 'Invoke-MalDoc'
      - 'raw.githubusercontent.com'
      - 'T1055'
  selection_powershell_iex_iwr_github:
    event.code: '1'
    process.name: 'powershell.exe'
    process.command_line|contains|all:
      - 'IEX'
      - 'iwr'
      - 'raw.githubusercontent.com'
      - 'Invoke-MalDoc.ps1'
  selection_sdbinst_shim_injection:
    event.code: '1'
    process.name: 'sdbinst.exe'
    process.command_line|contains|all:
      - '-m'
      - '-bg'
  condition: selection_powershell_iex_invokemaldoc or selection_powershell_iex_iwr_github or selection_sdbinst_shim_injection
falsepositives:
  - Security researchers or red team operators running Atomic Red Team tests in authorized lab environments
  - Legitimate software deployment pipelines that use PowerShell with IEX and GitHub raw content for module loading
  - IT administrators using sdbinst.exe with -m -bg flags for legitimate application compatibility shim deployment
level: high
