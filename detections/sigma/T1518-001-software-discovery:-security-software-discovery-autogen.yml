title: Security Software Discovery via SecurityHealthHost and Reconnaissance Tools
id: 9144651a-2b56-4047-ba53-1cff3babe181
status: experimental
description: Detects non-system processes spawning SecurityHealthHost.exe with COM-based invocation arguments alongside reconnaissance tools such as whoami.exe and hostname.exe, indicative of security software discovery activity per ATT&CK T1518.001.
author: 1xLoZec
date: 2026/05/10
references:
    - https://attack.mitre.org/techniques/T1518/001/
tags:
    - attack.discovery
    - attack.t1518.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_security_health_com:
        event.code: '1'
        process.name: 'SecurityHealthHost.exe'
        process.command_line|contains: '-Embedding'
    selection_recon_tools:
        event.code: '1'
        process.parent.name: 'powershell.exe'
        process.name|in:
            - 'whoami.exe'
            - 'HOSTNAME.EXE'
            - 'hostname.exe'
    selection_smartscreen_com:
        event.code: '1'
        process.name: 'smartscreen.exe'
        process.command_line|endswith: '-Embedding'
        process.parent.name|in:
            - 'powershell.exe'
            - 'cmd.exe'
    condition: selection_security_health_com or (selection_recon_tools and selection_smartscreen_com)
falsepositives:
    - Legitimate COM-based invocations of SecurityHealthHost.exe by Windows Security Center during scheduled health checks
    - IT administrators running whoami.exe or hostname.exe via PowerShell for inventory or diagnostic purposes
    - Endpoint management or monitoring tools that invoke smartscreen.exe via COM for security validation workflows
level: medium
fields:
    - process.name
    - process.executable
    - process.command_line
    - process.parent.name
    - process.parent.executable
    - winlog.event_data.IntegrityLevel
    - event.code