title: Process Discovery via Scripting Interpreter - whoami and hostname Execution
id: 446e7f75-e0c5-48f7-a701-807d8b0a481c
status: experimental
description: Detects whoami.exe or HOSTNAME.EXE spawned by scripting interpreters such as powershell.exe or cmd.exe, indicating potential post-exploitation process discovery consistent with ATT&CK T1057.
author: 1xLoZec
date: 2026/05/10
references:
    - https://attack.mitre.org/techniques/T1057/
tags:
    - attack.discovery
    - attack.t1057
logsource:
    category: process_creation
    product: windows
detection:
    selection_child:
        event.code: '1'
        process.name|contains:
            - 'whoami.exe'
            - 'HOSTNAME.EXE'
    selection_parent:
        process.parent.name|contains:
            - 'powershell.exe'
            - 'cmd.exe'
            - 'wscript.exe'
    filter_legitimate:
        process.parent.name|contains:
            - 'explorer.exe'
    condition: selection_child and selection_parent and not filter_legitimate
falsepositives:
    - Legitimate administrative scripts that invoke whoami or hostname for diagnostic or inventory purposes
    - Automated deployment or configuration management tools running under scripting interpreters
level: medium
fields:
    - process.name
    - process.executable
    - process.command_line
    - process.parent.name
    - process.parent.executable
    - winlog.event_data.IntegrityLevel





