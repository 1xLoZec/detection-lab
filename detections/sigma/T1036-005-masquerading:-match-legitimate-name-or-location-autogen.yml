title: Masquerading System Utilities via Path Mismatch or Suspicious Parent
id: 73cfc61f-1ee0-4dcc-ad78-edb3fda1ed6c
status: experimental
description: Detects system utility binaries (whoami.exe, hostname.exe, svchost.exe, etc.) executing from paths outside their expected system directories, indicating potential masquerading consistent with T1036.005.
author: 1xLoZec
date: 2026/05/10
references:
    - https://attack.mitre.org/techniques/T1036/005/
tags:
    - attack.defense_evasion
    - attack.t1036.005
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        process.name|endswith:
            - whoami.exe
            - hostname.exe
            - svchost.exe
            - taskhostw.exe
            - smartscreen.exe
    filter:
        process.executable|startswith:
            - 'C:\Windows\System32\'
            - 'C:\Windows\SysWOW64\'
            - 'C:\Windows\WinSxS\'
    condition: selection and not filter
falsepositives:
    - Penetration testing tools or red team exercises invoking system utilities from non-standard paths
    - Developer environments with custom builds of system utilities
level: high
fields:
    - process.name
    - process.executable
    - process.command_line
    - process.parent.name
    - process.parent.executable