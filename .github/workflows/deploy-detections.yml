name: Validate and Deploy Detection Rules

on:
  push:
    branches:
      - main
    paths:
      - 'detections/sigma/**'
  pull_request:
    branches:
      - main
    paths:
      - 'detections/sigma/**'

permissions:
  contents: write  # required to commit healed rules back

jobs:
  validate-and-deploy:
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          pip install \
            pysigma==0.11.23 \
            pysigma-backend-elasticsearch==1.1.6 \
            pysigma-pipeline-sysmon==1.0.4 \
            pysigma-pipeline-windows==1.2.0 \
            requests==2.32.5 \
            pyyaml==6.0.2

      - name: Find changed Sigma rules
        id: changed-files
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'detections/sigma/*.yml' | tr '\n' ' ')
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'detections/sigma/*.yml' | tr '\n' ' ')
          fi
          echo "files=$CHANGED" >> $GITHUB_OUTPUT
          if [ -n "$CHANGED" ]; then
            echo "any_changed=true" >> $GITHUB_OUTPUT
          else
            echo "any_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate and self-heal each changed rule
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELASTIC_URL: ${{ secrets.ELASTIC_URL }}
          ELASTIC_API_KEY: ${{ secrets.ELASTIC_API_KEY }}
          GMAIL_FROM: ${{ secrets.GMAIL_FROM }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          FAILED=0
          for file in ${{ steps.changed-files.outputs.files }}; do
            if [ -f "$file" ]; then
              echo "=========================================="
              echo "Validating: $file"
              echo "=========================================="
              set +e
              python3 validate_rule.py "$file"
              EXIT_CODE=$?
              set -e
              if [ $EXIT_CODE -ne 0 ]; then
                echo "CIRCUIT BREAKER: $file could not be validated or healed — skipping"
                FAILED=1
              fi
            fi
          done
          if [ $FAILED -ne 0 ]; then
            echo "One or more rules failed validation — check circuit breaker emails"
            exit 1
          fi

      - name: Commit any self-healed rules back to repo
        if: ${{ !cancelled() && steps.changed-files.outputs.any_changed == 'true' && github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}
          if ! git diff --quiet; then
            git add detections/sigma/
            git commit -m "auto-heal: self-healed sigma rules [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "Healed rules committed back to repo"
          else
            echo "No rules were modified by self-healer"
          fi

      - name: Deploy approved rules to Kibana
        if: ${{ !cancelled() && steps.changed-files.outputs.any_changed == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          ELASTIC_URL: ${{ secrets.ELASTIC_URL }}
          ELASTIC_API_KEY: ${{ secrets.ELASTIC_API_KEY }}
        run: |
          for file in ${{ steps.changed-files.outputs.files }}; do
            if [ -f "$file" ]; then
              echo "Deploying: $file"
              python3 deploy_rule.py "$file"
            fi
          done
