title: PowerShell IEX Remote Download Targeting Office Macro Execution via raw.githubusercontent.com
id: e998f335-c133-40a1-b6dd-8dab20e774ae
status: experimental
description: Detects PowerShell processes using IEX to download and execute scripts from raw.githubusercontent.com that reference Office product names or macro execution functions, consistent with Atomic Red Team T1204.002 test execution involving Invoke-MalDoc targeting Word documents.
author: 1xLoZec
date: 2026/05/10
references:
    - https://attack.mitre.org/techniques/T1204/002/
    - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1204.002/T1204.002.yaml
tags:
    - attack.execution
    - attack.t1204.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_process:
        process.name: 'powershell.exe'
    selection_iex_iwr:
        process.command_line|contains|all:
            - 'IEX'
            - 'iwr'
            - 'raw.githubusercontent.com'
    selection_maldoc_indicators:
        process.command_line|contains:
            - 'Invoke-MalDoc'
            - 'Invoke-Maldoc'
            - 'T1204.002'
    selection_office_macro:
        process.command_line|contains:
            - 'officeProduct'
            - 'macroFile'
            - 'Word'
            - 'Excel'
            - 'macrocode'
    condition: selection_process and selection_iex_iwr and (selection_maldoc_indicators or selection_office_macro)
falsepositives:
    - Security researchers or red team operators legitimately running Atomic Red Team tests in authorized environments
    - Internal automation scripts that use IEX with raw.githubusercontent.com for benign tooling deployment
fields:
    - process.name
    - process.command_line
    - process.parent.name
    - winlog.event_data.IntegrityLevel
    - dns.question.name
level: high





