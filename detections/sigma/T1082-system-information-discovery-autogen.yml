title: System Information Discovery via Chained CMD Enumeration Utilities
id: 32bcde9b-c3c8-4b34-ae75-89d885cda787
status: experimental
description: Detects cmd.exe spawning multiple system and network enumeration utilities in close temporal proximity or as a chained command sequence. Indicative of host reconnaissance activity associated with T1082 System Information Discovery.
author: 1xLoZec
date: 2026/05/10
references:
    - https://attack.mitre.org/techniques/T1082/
tags:
    - attack.discovery
    - attack.t1082
logsource:
    category: process_creation
    product: windows
detection:
    selection_parent:
        process.parent.name: 'cmd.exe'
    selection_enum_processes:
        process.name|contains:
            - 'whoami.exe'
            - 'HOSTNAME.EXE'
            - 'ipconfig.exe'
            - 'arp.exe'
            - 'nbtstat.exe'
            - 'netsh.exe'
            - 'net.exe'
            - 'net1.exe'
    selection_chained_cmd:
        process.name: 'cmd.exe'
        process.command_line|contains|all:
            - 'ipconfig'
            - 'netsh'
            - 'arp'
            - 'nbtstat'
            - 'net config'
    selection_high_integrity:
        process.name|contains:
            - 'whoami.exe'
            - 'HOSTNAME.EXE'
        winlog.event_data.IntegrityLevel:
            - 'High'
            - 'System'
    condition: selection_chained_cmd or (selection_parent and selection_enum_processes) or selection_high_integrity
falsepositives:
    - Legitimate system administrators performing manual network diagnostics or inventory collection
    - Automated IT asset management or monitoring agents that enumerate host information
    - Help desk scripts executing chained network commands during troubleshooting sessions
level: medium
fields:
    - process.name
    - process.executable
    - process.command_line
    - process.parent.name
    - process.parent.executable
    - winlog.event_data.IntegrityLevel
    - event.code
