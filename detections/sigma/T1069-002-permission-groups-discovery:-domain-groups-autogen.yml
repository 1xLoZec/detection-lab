title: Domain Group Enumeration Chain via Net.exe at High Integrity
id: 10edaa6c-50ec-48e8-af0f-8d2a19f0c9a1
status: experimental
description: Detects net.exe or net1.exe executing domain group enumeration commands including 'group /domain', 'domain admins', or 'enterprise admins' arguments, particularly when executed at High integrity level. Indicative of T1069.002 post-compromise domain reconnaissance.
author: 1xLoZec
date: 2026/05/10
references:
  - https://attack.mitre.org/techniques/T1069/002/
tags:
  - attack.discovery
  - attack.t1069.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    process.name|contains:
      - 'net.exe'
      - 'net1.exe'
    process.command_line|contains:
      - 'group /domain'
      - 'domain admins'
      - 'enterprise admins'
  condition: selection
falsepositives:
  - Legitimate IT administrators performing domain group audits or inventory tasks from an elevated session
  - Automated IT management or helpdesk tooling that enumerates domain groups using net.exe under elevated credentials
  - Security assessment or penetration testing activity authorized within the environment
level: medium
fields:
  - process.name
  - process.command_line
  - process.parent.name