title: Suspicious sdbinst.exe Execution
id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
status: experimental
description: Detects suspicious execution of sdbinst.exe associated with credential access techniques
author: 1xLoZec
date: 2026/05/08
references:
    - https://attack.mitre.org/techniques/T1003/
tags:
    - attack.credential_access
    - attack.t1003
logsource:
    product: windows
    service: sysmon
detection:
    selection:
        EventID: 1
        Image|endswith: '\sdbinst.exe'
    condition: selection
level: medium
falsepositives:
    - Legitimate application compatibility database installations

