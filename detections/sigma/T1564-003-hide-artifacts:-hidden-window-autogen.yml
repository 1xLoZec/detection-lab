title: HideFileExt Registry Modification via reg.exe or PowerShell
id: aea83186-6d3e-4623-aa2d-e7f2a21a088e
status: experimental
description: Detects reg.exe or PowerShell writing HideFileExt=1 to the current user Explorer Advanced registry key, a technique used to hide file extensions and trick users into executing disguised malicious files.
author: 1xLoZec
date: 2026/05/10
references:
    - https://attack.mitre.org/techniques/T1564/003/
    - https://docs.microsoft.com/en-us/windows/win32/shell/folder-info
tags:
    - attack.defense_evasion
    - attack.t1564.003
logsource:
    category: registry_event
    product: windows
detection:
    selection_registry:
        event.code: '13'
        registry.key|contains: '\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
        registry.value: 'HideFileExt'
    selection_process:
        process.name|in:
            - 'reg.exe'
            - 'powershell.exe'
    selection_parent:
        process.parent.name|in:
            - 'cmd.exe'
            - 'powershell.exe'
            - 'wscript.exe'
            - 'cscript.exe'
            - 'mshta.exe'
    condition: selection_registry and selection_process and selection_parent
falsepositives:
    - System administrators or deployment scripts legitimately configuring user profile settings via reg.exe
    - Group Policy or configuration management tools applying Explorer settings
    - IT provisioning automation tools that configure default user environment settings
level: medium
