title: Network Service Scanning - Inbound Mass Scan from Known Scanner IP
id: b70565cc-77c4-4dd4-8838-a1fdb18a392d
status: experimental
description: Detects inbound network connection attempts from known mass-scanning source IP 77.83.240.70 (ASN 49870, Alsycon B.V.) or similar high-volume scanners targeting multiple distinct ports. Indicative of T1046 Network Service Scanning behaviour as observed via honeypot telemetry showing over 1 million events in 24 hours across P0f, Suricata, Honeytrap, Fatt, and Miniprint honeypot types.
author: 1xLoZec
date: 2026/05/27
references:
  - https://attack.mitre.org/techniques/T1046/
tags:
  - attack.discovery
  - attack.t1046
logsource:
  product: windows
  service: sysmon
detection:
  selection_event:
    event.code: '3'
  selection_source_ip:
    source.ip: '77.83.240.70'
  selection_destination_ports:
    destination.port:
      - 21
      - 22
      - 23
      - 25
      - 53
      - 80
      - 110
      - 135
      - 139
      - 143
      - 443
      - 445
      - 631
      - 1433
      - 1883
      - 3306
      - 3389
      - 5060
      - 5900
      - 6379
      - 8080
      - 8443
      - 9200
      - 27017
  condition: selection_event and selection_source_ip and selection_destination_ports
falsepositives:
  - Legitimate security scanning tools operated by internal red teams targeting the same destination ports
  - Threat intelligence or honeypot feed aggregation systems that replay or mirror scanner traffic
  - Misconfigured network monitoring appliances generating synthetic connection events
level: high
fields:
  - source.ip
  - source.port
  - destination.ip
  - destination.port
  - process.name
  - process.executable