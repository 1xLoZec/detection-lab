title: CMD Chaining Multiple Network Discovery Utilities - T1016
id: c480bbba-f460-498b-94cb-9921a52d9ec9
status: experimental
description: Detects cmd.exe spawning three or more network discovery utilities (ipconfig, arp, nbtstat, netsh, net) within a short time window or chained via & operators in a single command line, consistent with post-exploitation network reconnaissance.
author: 1xLoZec
date: 2026/05/10
references:
    - https://attack.mitre.org/techniques/T1016/
tags:
    - attack.discovery
    - attack.t1016
logsource:
    category: process_creation
    product: windows
detection:
    selection_parent:
        process.parent.name: 'cmd.exe'
        winlog.event_data.IntegrityLevel: 'High'
    selection_children:
        process.name|contains:
            - 'ipconfig.exe'
            - 'arp.exe'
            - 'nbtstat.exe'
            - 'netsh.exe'
            - 'net.exe'
    selection_chained_cmdline:
        process.parent.name: 'cmd.exe'
        process.command_line|contains|all:
            - 'ipconfig'
            - 'netsh'
            - 'arp'
    condition: (selection_parent and selection_children) or selection_chained_cmdline
falsepositives:
    - Legitimate network administrators running diagnostic scripts that chain multiple network utilities
    - IT automation tools or configuration management agents executing network enumeration as part of health checks
    - Helpdesk or support scripts that gather network information for troubleshooting purposes
level: high



