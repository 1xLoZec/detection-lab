title: PowerShell Spawning Reconnaissance Commands
id: 0d8f5280-0209-4112-a17f-8e6830258c82
status: experimental
description: Detects PowerShell spawning common reconnaissance commands used by attackers after initial access. Focuses on higher-fidelity binaries to reduce false positives.
author: 1xLoZec
date: 2026/05/08
references:
    - https://attack.mitre.org/techniques/T1059/001/
tags:
    - attack.execution
    - attack.t1059.001
    - attack.discovery
logsource:
    product: windows
    service: sysmon
detection:
    selection:
        EventID: 1
        ParentImage|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\powershell_ise.exe'
        Image|endswith:
            - '\whoami.exe'
            - '\systeminfo.exe'
            - '\nltest.exe'
            - '\net1.exe'
            - '\wmic.exe'
    condition: selection
level: medium
falsepositives:
    - Legitimate administrative scripts — tune by adding exclusions for known good parent paths














