title: T1055 Process Injection via PowerShell IEX and CreateRemoteThread
id: 64bd43e0-a788-4fbb-9783-ea831037042f
status: experimental
description: Detects T1055 Process Injection activity characterized by PowerShell IEX downloading Invoke-MalDoc.ps1 from raw.githubusercontent.com with explicit T1055 artifact references, Sysmon CreateRemoteThread (Event ID 8) targeting unknown processes, and sdbinst.exe execution outside of known patch/update contexts. This combination is highly indicative of Atomic Red Team T1055 simulation or real adversarial process injection.
author: 1xLoZec
date: 2026/05/10
references:
  - https://attack.mitre.org/techniques/T1055/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1055/T1055.md
  - https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
tags:
  - attack.defense_evasion
  - attack.t1055
  - attack.t1055.011
logsource:
  product: windows
  category: sysmon
detection:
  selection_powershell_iex_t1055:
    event.code: '1'
    process.name: 'powershell.exe'
    process.command_line|contains|all:
      - 'IEX'
      - 'Invoke-MalDoc'
      - 'T1055'
      - 'raw.githubusercontent.com'
  selection_powershell_iex_invokemaldoc:
    event.code: '1'
    process.name: 'powershell.exe'
    process.command_line|contains|all:
      - 'Invoke-MalDoc.ps1'
      - 'raw.githubusercontent.com'
      - 'iwr'
  selection_createremotethread_unknown:
    event.code: '8'
    winlog.event_data.TargetImage|contains: '<unknown process>'
    process.name: 'powershell.exe'
  selection_sdbinst_suspicious:
    event.code: '1'
    process.name: 'sdbinst.exe'
    process.command_line|contains|all:
      - '-m'
      - '-bg'
  selection_dns_github_artifacts:
    event.code: '22'
    dns.question.name: 'raw.githubusercontent.com'
    process.name: 'powershell.exe'
  condition: selection_powershell_iex_t1055 or selection_powershell_iex_invokemaldoc or (selection_createremotethread_unknown and selection_dns_github_artifacts) or selection_sdbinst_suspicious
falsepositives:
  - Legitimate security researchers or red team operators running Atomic Red Team simulations in authorized lab environments
  - Enterprise patch management systems invoking sdbinst.exe with -m -bg flags during legitimate application compatibility shim deployments via SCCM or Intune
  - Automated testing pipelines that download and execute PowerShell scripts from GitHub as part of CI/CD security validation workflows
  - System administrators running sanctioned compatibility database updates that trigger sdbinst.exe with similar arguments
level: high