title: File and Directory Discovery via Recursive Dir and Tree Commands
id: bdade355-a931-4fba-b349-eedb384f8993
status: experimental
description: Detects cmd.exe spawning recursive dir /s commands across multiple sensitive paths with output redirection to a temp file, combined with tree /F execution, consistent with T1083 pre-exfiltration reconnaissance.
author: 1xLoZec
date: 2026/05/10
references:
    - https://attack.mitre.org/techniques/T1083/
tags:
    - attack.discovery
    - attack.t1083
logsource:
    category: process_creation
    product: windows
detection:
    selection_cmd_dir:
        event.code: '1'
        process.name: 'cmd.exe'
        process.command_line|contains|all:
            - 'dir /s'
            - 'T1083Test1.txt'
            - '>>'
    selection_tree:
        event.code: '1'
        process.name: 'tree.com'
        process.command_line|contains: '/F'
    selection_sensitive_paths:
        event.code: '1'
        process.name: 'cmd.exe'
        process.command_line|contains:
            - 'c:\\'
            - 'Program Files'
            - 'AppData\\Roaming\\Microsoft\\Windows\\Recent'
            - 'Documents and Settings'
    condition: (selection_cmd_dir and selection_sensitive_paths) or selection_tree
falsepositives:
    - Legitimate administrative scripts performing directory audits or inventory collection
    - Backup or asset management tools that enumerate directory structures
fields:
    - process.name
    - process.executable
    - process.command_line
    - process.parent.name
    - process.parent.executable
level: high





