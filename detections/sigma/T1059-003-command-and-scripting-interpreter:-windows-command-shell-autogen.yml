title: PowerShell Launching .bat/.cmd File via Start-Process or Invoke-Expression
id: 62ed787d-48b7-4072-bca6-2a9048ed8bec
status: experimental
description: Detects PowerShell using Start-Process or Invoke-Expression to execute .bat or .cmd files from user-writable or non-standard directories, indicative of T1059.003 Windows Command Shell chaining.
author: 1xLoZec
date: 2026/05/10
references:
    - https://attack.mitre.org/techniques/T1059/003/
tags:
    - attack.execution
    - attack.t1059.003
logsource:
    category: process_creation
    product: windows
detection:
    selection_process:
        event.code: '1'
        process.name: 'powershell.exe'
    selection_cmdline_method:
        process.command_line|contains:
            - 'Start-Process'
            - 'Invoke-Expression'
    selection_cmdline_extension:
        process.command_line|contains:
            - '.bat'
            - '.cmd'
    selection_cmdline_path:
        process.command_line|contains:
            - '\Users\'
            - '\AppData\'
            - '\Temp\'
            - '\Public\'
            - '\ExternalPayloads\'
            - '\Downloads\'
            - '\Desktop\'
    condition: selection_process and selection_cmdline_method and selection_cmdline_extension and selection_cmdline_path
falsepositives:
    - Legitimate administrative scripts using PowerShell to launch batch files from user profile directories
    - Software installers or deployment tools that chain PowerShell with batch file execution
    - Developer tooling or build systems invoking batch files via PowerShell from project directories
level: high




