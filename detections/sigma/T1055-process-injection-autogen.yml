title: T1055 CreateRemoteThread Targeting Unknown Process via Sysmon Event ID 8
id: 7a254b3e-7547-4aae-b028-4263188c0031
status: experimental
description: Detects Sysmon Event ID 8 CreateRemoteThread where the target process is listed as unknown, a strong indicator of process injection into an unresolved or hollowed process. Correlates with high-integrity PowerShell activity performing Atomic Red Team T1055 injection tests.
author: 1xLoZec
date: 2026/05/10
references:
  - https://attack.mitre.org/techniques/T1055/
  - https://www.elastic.co/guide/en/ecs/current/ecs-process.html
tags:
  - attack.defense_evasion
  - attack.t1055
logsource:
  product: windows
  category: create_remote_thread
detection:
  selection_remote_thread_unknown_target:
    event.code: '8'
    winlog.event_data.TargetImage|contains: '<unknown process>'
  filter_legitimate_system_sources:
    process.name|in:
      - 'TrustedInstaller.exe'
      - 'MoUsoCoreWorker.exe'
      - 'TiWorker.exe'
      - 'svchost.exe'
  condition: selection_remote_thread_unknown_target and not filter_legitimate_system_sources
falsepositives:
  - Antivirus or EDR software that injects threads into processes for monitoring purposes may appear as unknown target in some configurations
  - Virtualization or sandbox software performing legitimate cross-process operations
  - Debugging tools such as WinDbg or x64dbg attaching to processes during development or incident response
level: high