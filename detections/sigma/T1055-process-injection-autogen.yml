title: Process Injection via PowerShell IEX and CreateRemoteThread with Atomic Red Team T1055 Indicators
id: b7e719f4-6d3a-48d0-951a-6408c79717b7
status: experimental
description: Detects Sysmon Event ID 8 (CreateRemoteThread) originating from powershell.exe or cmd.exe combined with outbound DNS queries to raw.githubusercontent.com and PowerShell command lines referencing T1055 or Invoke-MalDoc. Also alerts on sdbinst.exe executed with -m -bg flags outside of patch/update context, which may indicate Application Shimming as an injection vector.
author: 1xLoZec
date: 2026/05/10
references:
  - https://attack.mitre.org/techniques/T1055/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1055/T1055.md
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1055/src/x64/T1055-macrocode.txt
tags:
  - attack.defense_evasion
  - attack.t1055
  - attack.t1055.001
  - attack.t1218.011
logsource:
  product: windows
  category: sysmon
detection:
  selection_createremotethread:
    event.code: '8'
    process.name|contains:
      - 'powershell.exe'
      - 'cmd.exe'
    winlog.event_data.TargetImage|contains: '<unknown process>'

  selection_iex_t1055:
    event.code: '1'
    process.name: 'powershell.exe'
    process.command_line|contains|all:
      - 'IEX'
      - 'raw.githubusercontent.com'
      - 'T1055'

  selection_iex_invokemaldoc:
    event.code: '1'
    process.name: 'powershell.exe'
    process.command_line|contains|all:
      - 'Invoke-MalDoc'
      - 'T1055'

  selection_iex_invokemaldoc_macrofile:
    event.code: '1'
    process.name: 'powershell.exe'
    process.command_line|contains:
      - 'T1055-macrocode.txt'
      - 'Invoke-MalDoc.ps1'

  selection_dns_github_raw:
    event.code: '22'
    dns.question.name: 'raw.githubusercontent.com'
    process.name|contains:
      - 'powershell.exe'
      - 'cmd.exe'

  selection_sdbinst_shim:
    event.code: '1'
    process.name: 'sdbinst.exe'
    process.command_line|contains|all:
      - '-m'
      - '-bg'

  filter_sdbinst_legitimate:
    process.parent.name|contains:
      - 'TrustedInstaller.exe'
      - 'TiWorker.exe'
      - 'svchost.exe'
    process.command_line|contains:
      - 'msimain.sdb'
      - 'sysmain.sdb'

  condition: selection_createremotethread or selection_iex_t1055 or selection_iex_invokemaldoc or selection_iex_invokemaldoc_macrofile or (selection_sdbinst_shim and not filter_sdbinst_legitimate) or selection_dns_github_raw

falsepositives:
  - Legitimate security researchers or red team operators executing Atomic Red Team T1055 tests in authorized environments
  - System administrators running PowerShell scripts that fetch resources from raw.githubusercontent.com for legitimate automation
  - Windows Update or patch management tooling invoking sdbinst.exe with -m -bg flags as part of compatibility shim database updates via TrustedInstaller or TiWorker
  - DevOps pipelines or CI/CD agents executing PowerShell IEX patterns to install dependencies from GitHub
  - Security tooling that performs CreateRemoteThread for monitoring or injection into processes for legitimate instrumentation purposes
level: high