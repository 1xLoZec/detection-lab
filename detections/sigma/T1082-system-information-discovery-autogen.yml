title: System Information Discovery - Chained Network and System Enumeration via CMD and PowerShell
id: 1e360948-ea2e-4162-9826-0d1afcd35550
status: experimental
description: Detects coordinated system and network discovery sweep using cmd.exe or powershell.exe spawning multiple discovery binaries chained via '&' operators, PowerShell downloading Discovery.bat from raw.githubusercontent.com, and extensive reg.exe queries against Run/Winlogon/SafeBoot registry hives. Consistent with post-compromise situational awareness gathering (T1082, T1016, T1049, T1012).
author: 1xLoZec
date: 2026/05/10
references:
  - https://attack.mitre.org/techniques/T1082/
  - https://attack.mitre.org/techniques/T1016/
  - https://attack.mitre.org/techniques/T1049/
  - https://attack.mitre.org/techniques/T1012/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1074.001/src/Discovery.bat
tags:
  - attack.discovery
  - attack.t1082
  - attack.t1016
  - attack.t1049
  - attack.t1012
  - attack.t1033
logsource:
  category: process_creation
  product: windows
  definition: Sysmon EventID 1 via Elastic Agent with ECS field mapping
detection:
  selection_chained_network_discovery:
    process.name:
      - 'cmd.exe'
      - 'powershell.exe'
    process.command_line|contains|all:
      - 'ipconfig'
      - 'netsh'
      - 'arp'
      - 'nbtstat'
      - 'net config'
  selection_chained_sysinfo_reg:
    process.name:
      - 'cmd.exe'
      - 'powershell.exe'
    process.command_line|contains|all:
      - 'systeminfo'
      - 'reg query'
      - 'Disk\\Enum'
  selection_powershell_download_discovery:
    process.name: 'powershell.exe'
    process.command_line|contains:
      - 'raw.githubusercontent.com/redcanaryco/atomic-red-team'
      - 'Discovery.bat'
  selection_powershell_invoke_maldoc:
    process.name: 'powershell.exe'
    process.command_line|contains|all:
      - 'Invoke-MalDoc'
      - 'raw.githubusercontent.com'
      - 'T1055'
  selection_reg_run_winlogon_hive:
    process.name: 'reg.exe'
    process.command_line|contains:
      - 'CurrentVersion\\Run'
      - 'CurrentVersion\\RunOnce'
      - 'Winlogon'
      - 'SafeBoot'
      - 'Active Setup\\Installed Components'
      - 'ShellServiceObjectDelayLoad'
      - 'Group Policy\\Scripts\\Startup'
  filter_legitimate_parent:
    process.parent.name:
      - 'TrustedInstaller.exe'
      - 'MoUsoCoreWorker.exe'
      - 'TiWorker.exe'
      - 'services.exe'
      - 'svchost.exe'
      - 'MicrosoftEdgeUpdate.exe'
      - 'SecurityHealthHost.exe'
  filter_system_user:
    winlog.event_data.IntegrityLevel: 'System'
    process.parent.name:
      - 'svchost.exe'
      - 'services.exe'
  condition: (1 of selection_chained_* or 1 of selection_powershell_* or selection_reg_run_winlogon_hive) and not 1 of filter_*
falsepositives:
  - Legitimate IT administrators running network diagnostic scripts or inventory collection tools that chain ipconfig, netsh, arp, and nbtstat commands
  - Security assessment tooling or vulnerability scanners executing enumeration commands via cmd.exe with chained operators
  - System management software (e.g., SCCM, Ansible, PDQ Deploy) invoking systeminfo and reg.exe queries for asset inventory
  - Automated patch management or compliance scripts querying Run/Winlogon registry keys for baseline auditing
  - Penetration testing engagements using Atomic Red Team or similar frameworks in authorized lab environments
level: high